<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Choose a new password — PawPal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#221610">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/pawpal.css?v=5">
  <script src="js/api.js?v=5" defer></script>
  <script src="js/ui.js?v=5" defer></script>
  <script src="js/pages/reset-password.js?v=5" defer></script>
</head>
<body data-layout="auth" data-page="reset">
<main id="main" tabindex="-1">
  <section class="section"><div class="container" style="max-width:520px">
    <form class="card card-pad" id="resetForm" novalidate>
      <h1 class="h3">Choose a new password</h1>
      <p class="muted small" style="margin-top:6px">After you save it, you'll be signed out everywhere else for security.</p>
      <div id="resetMsg" style="margin-top:16px"></div>
      <div class="stack" style="margin-top:16px">
        <div class="field"><label for="pw1">New password</label><input class="input" id="pw1" type="password" autocomplete="new-password" minlength="8" required><span class="hint">At least 8 characters, including a letter and a number.</span></div>
        <div class="field"><label for="pw2">Confirm new password</label><input class="input" id="pw2" type="password" autocomplete="new-password" required></div>
        <button class="btn btn-primary btn-lg btn-block" id="resetBtn" type="submit">Save new password</button>
      </div>
    </form>
  </div></section>
</main>
</body>
</html>
