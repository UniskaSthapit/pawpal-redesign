<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My applications — PawPal</title>
  <meta name="description" content="Track your adoption applications step by step.">
  <meta name="theme-color" content="#221610">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/pawpal.css?v=5">
  <script src="js/api.js?v=5" defer></script>
  <script src="js/ui.js?v=5" defer></script>
  <script src="js/chat.js?v=5" defer></script>
  <script src="js/pages/my-applications.js?v=5" defer></script>
</head>
<body data-layout="account" data-page="applications">
<main id="main" tabindex="-1">
<div class="app-head"><div><h1>My applications</h1><p>Follow every step, reply to the shelter and see what happens next.</p></div></div>
<div class="grid" style="grid-template-columns:minmax(0,340px) minmax(0,1fr);align-items:start" id="appsLayout">
  <div class="stack" style="--stack:10px" id="appList" role="list" aria-label="Your applications"><div class="skeleton" style="height:84px"></div><div class="skeleton" style="height:84px"></div></div>
  <div id="appDetail" aria-live="polite"></div>
</div>
<style>@media (max-width: 1000px){ #appsLayout{grid-template-columns:minmax(0,1fr)!important} }
.app-item{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);text-align:left;width:100%}
.app-item:hover{border-color:#D3C1AC}.app-item[aria-current="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.app-item img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--paper-2)}
.app-item b{font-size:16px;display:block}.detail-hero{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center}
.detail-hero img{width:120px;height:120px;border-radius:20px;object-fit:cover;background:var(--paper-2)}
@media (max-width:560px){.detail-hero{grid-template-columns:80px 1fr}.detail-hero img{width:80px;height:80px}}</style>
</main>
</body>
</html>
