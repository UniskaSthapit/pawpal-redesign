<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox — PawPal shelter portal</title>
  <meta name="description" content="Answer adopter questions and messages sent to PawPal.">
  <meta name="theme-color" content="#FFFBF5">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="preload" href="fonts/fredoka-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/pawpal.css?v=7">
  <script src="js/api.js?v=7" defer></script>
  <script src="js/ui.js?v=7" defer></script>
  <script src="js/pages/staff-enquiries.js?v=7" defer></script>
</head>
<body data-layout="staff" data-page="staff-enq">
<main id="main" tabindex="-1">
<div class="app-head"><div><h1>Inbox</h1><p id="inboxSub">Questions about your pets and messages sent to PawPal. Every reply is emailed and appears on the adopter's dashboard, where they can answer back.</p></div>
  <span class="small muted" id="refreshNote" aria-live="polite"></span></div>
<div class="seg inbox-kind" role="tablist" aria-label="Inbox" id="kindTabs">
  <button type="button" role="tab" data-kind="enquiries" aria-selected="true"><span data-icon="paw"></span>Pet questions <span class="n" id="nEnq"></span></button>
  <button type="button" role="tab" data-kind="messages" aria-selected="false"><span data-icon="mail"></span>Contact messages <span class="n" id="nMsg"></span></button>
</div>
<div class="tabs" role="tablist" id="enqTabs" style="margin-top:16px"><button class="tab" role="tab" data-f="Open" aria-selected="true">Open <span class="n" id="nOpen">0</span></button><button class="tab" role="tab" data-f="Answered" aria-selected="false">Answered</button><button class="tab" role="tab" data-f="Closed" aria-selected="false">Closed</button><button class="tab" role="tab" data-f="" aria-selected="false">All</button></div>
<div class="stack" style="--stack:14px" id="enqList"><div class="skeleton" style="height:120px"></div></div>
</main>
</body>
</html>
