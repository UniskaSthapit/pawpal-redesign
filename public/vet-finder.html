<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a vet near you — PawPal</title>
  <meta name="description" content="Find veterinary clinics near you.">
  <meta name="theme-color" content="#FFFBF5">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="preload" href="fonts/fredoka-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/pawpal.css?v=7">
  <script src="js/api.js?v=7" defer></script>
  <script src="js/ui.js?v=7" defer></script>
  <script src="js/chat.js?v=7" defer></script>
  <script src="js/pages/vet-finder.js?v=7" defer></script>
</head>
<body data-layout="public" data-page="vets">
<main id="main" tabindex="-1">
<section class="page-hero page-hero-compact"><div class="container">
  <span class="eyebrow">Care after adoption</span><h1 class="h1">Find a vet <em>near you</em></h1>
  <p class="lead">A first check-up within two weeks of adoption is a great start. Search by suburb or postcode, or use your location.</p>
</div></section>
<section class="section-sm"><div class="container vet-layout">
  <div class="vet-panel">
    <form class="card vet-search" id="vetForm" role="search">
      <label class="label" for="vetQ">Suburb or postcode</label>
      <div class="input-group"><span data-icon="pin"></span><input class="input" id="vetQ" placeholder="e.g. Footscray or 3011" maxlength="100" autocomplete="off"></div>
      <div class="row" style="flex-wrap:nowrap"><button class="btn btn-primary" type="submit" style="flex:1"><span data-icon="search"></span>Search</button><button class="btn" type="button" id="nearMe"><span data-icon="pin"></span>Near me</button></div>
    </form>
    <div class="vet-results-head"><h2 id="vetHeading">Nearest clinics</h2><span class="small muted" id="vetWhere"></span></div>
    <ol class="plain vet-list" id="vetList" aria-live="polite"><li class="skeleton" style="height:96px"></li><li class="skeleton" style="height:96px"></li><li class="skeleton" style="height:96px"></li></ol>
    <button class="btn btn-ghost btn-sm" type="button" id="vetMore" hidden>Show more clinics</button>
    <p class="tiny muted" id="vetSource"></p>
  </div>
  <div class="vet-map card">
    <iframe id="vetMap" title="Map of veterinary clinics near your search" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <button class="btn btn-sm vet-map-reset" type="button" id="mapAll" hidden><span data-icon="refresh"></span>Show all nearby vets</button>
  </div>
</div></section>
</main>
</body>
</html>
