<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelter dashboard — PawPal</title>
  <meta name="description" content="PawPal shelter portal overview.">
  <meta name="theme-color" content="#221610">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/pawpal.css?v=5">
  <script src="js/api.js?v=5" defer></script>
  <script src="js/ui.js?v=5" defer></script>
  <script src="js/pages/staff-home.js?v=5" defer></script>
</head>
<body data-layout="staff" data-page="staff-home">
<main id="main" tabindex="-1">
<div class="app-head"><div><h1 id="hello">Shelter overview</h1><p id="helloSub">What needs your attention today.</p></div>
  <div class="row"><a class="btn" href="applications.html?status=open"><span data-icon="file"></span>Review applications</a><a class="btn btn-primary" href="add-pet.html"><span data-icon="plus"></span>Add a pet</a></div></div>
<div class="kpis" id="kpis"><div class="kpi skeleton" style="height:120px"></div><div class="kpi skeleton" style="height:120px"></div><div class="kpi skeleton" style="height:120px"></div><div class="kpi skeleton" style="height:120px"></div></div>
<section class="card" style="margin-top:20px"><div class="card-head"><h2>Adoption pipeline</h2><a class="small" href="applications.html">Open pipeline</a></div><div class="card-body"><div class="pipeline" id="pipeline"></div></div></section>
<div class="dash-grid">
  <section class="card"><div class="card-head"><h2>Latest applications</h2><a class="small" href="applications.html">View all</a></div><div id="recent"></div></section>
  <div class="stack" style="--stack:20px">
    <section class="card"><div class="card-head"><h2>Upcoming appointments</h2></div><div id="upcoming"></div></section>
    <form class="card card-pad ai-panel" id="askForm" style="border-radius:20px">
      <span class="src-label src-ai"><span data-icon="sparkle"></span>Shelter assistant</span>
      <label class="label" for="askQ" style="display:block;margin-top:8px">Ask about your shelter's data</label>
      <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input class="input" id="askQ" placeholder="Which applications need review?"><button class="btn btn-dark" type="submit" aria-label="Ask">Ask</button></div>
    </form>
  </div>
</div>
<section class="card" style="margin-top:20px"><div class="card-head"><div><span class="src-label src-ai"><span data-icon="sparkle"></span>From your last 30 days of data</span><h2>Insights</h2></div><a class="small" href="analytics.html">Full analytics</a></div><div class="card-body" id="insights"><div class="skeleton" style="height:60px"></div></div></section>
</main>
</body>
</html>
