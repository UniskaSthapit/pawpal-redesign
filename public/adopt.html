<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adopt a pet — PawPal</title>
  <meta name="description" content="Browse rescue dogs, cats, small pets, birds, reptiles, fish, goats and cows available for adoption. Filter by species, age, size, location and lifestyle, or describe what you're looking for.">
  <meta name="theme-color" content="#FBF6EE">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/pawpal.css?v=6">
  <script src="js/api.js?v=6" defer></script>
  <script src="js/ui.js?v=6" defer></script>
  <script src="js/chat.js?v=6" defer></script>
  <script src="js/pages/adopt.js?v=6" defer></script>
</head>
<body data-layout="public" data-page="adopt">
<main id="main" tabindex="-1">
  <section class="page-hero">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="home.html">Home</a><span aria-hidden="true">/</span><span>Adopt a pet</span></nav>
      <h1 class="h1">Meet the pets <em>waiting for you</em></h1>
      <p class="lead">Every animal here is waiting in a partner shelter or foster home. Filter the list, or simply describe what you're looking for.</p>
      <form class="nl-search" id="nlForm" role="search" style="margin-top:28px;max-width:760px">
        <div class="input-group"><span data-icon="sparkle"></span>
          <label class="sr-only" for="nlInput">Describe your ideal pet or search by name or breed</label>
          <input class="input" id="nlInput" maxlength="300" placeholder="Try “calm dog for an apartment” or a breed like “beagle”" autocomplete="off">
        </div>
        <button class="btn btn-primary" type="submit"><span data-icon="search"></span>Search</button>
      </form>
    </div>
  </section>

  <section class="section-sm">
    <div class="container discover">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="filters-head"><h2>Filters</h2><div class="row" style="gap:4px"><button class="link-btn small" id="clearFilters" type="button">Clear all</button>
          <button class="icon-btn" id="closeFilters" type="button" aria-label="Close filters" style="display:none"><span data-icon="close"></span></button></div></div>
        <div class="filters-body">
          <div class="filter-group"><h3 id="fSpecies">Species</h3><div class="chips" role="group" aria-labelledby="fSpecies">
            <button class="chip" type="button" data-f="type" data-v="dog" aria-pressed="false"><span data-icon="dog"></span>Dogs</button>
            <button class="chip" type="button" data-f="type" data-v="cat" aria-pressed="false"><span data-icon="cat"></span>Cats</button>
            <button class="chip" type="button" data-f="type" data-v="small" aria-pressed="false"><span data-icon="rabbit"></span>Small pets</button>
            <button class="chip" type="button" data-f="type" data-v="bird" aria-pressed="false"><span data-icon="bird"></span>Birds</button>
            <button class="chip" type="button" data-f="type" data-v="reptile" aria-pressed="false"><span data-icon="turtle"></span>Reptiles</button>
            <button class="chip" type="button" data-f="type" data-v="fish" aria-pressed="false"><span data-icon="fish"></span>Fish</button>
            <button class="chip" type="button" data-f="type" data-v="farm" aria-pressed="false"><span data-icon="barn"></span>Farm</button></div></div>
          <div class="filter-group"><h3 id="fAge">Age</h3><div class="chips" role="group" aria-labelledby="fAge">
            <button class="chip" type="button" data-f="age" data-v="baby" aria-pressed="false">Under 1</button>
            <button class="chip" type="button" data-f="age" data-v="young" aria-pressed="false">1–2 yrs</button>
            <button class="chip" type="button" data-f="age" data-v="adult" aria-pressed="false">3–7 yrs</button>
            <button class="chip" type="button" data-f="age" data-v="senior" aria-pressed="false">8+ yrs</button></div></div>
          <div class="filter-group"><h3 id="fSize">Size</h3><div class="chips" role="group" aria-labelledby="fSize">
            <button class="chip" type="button" data-f="size" data-v="small" aria-pressed="false">Small</button>
            <button class="chip" type="button" data-f="size" data-v="medium" aria-pressed="false">Medium</button>
            <button class="chip" type="button" data-f="size" data-v="large" aria-pressed="false">Large</button></div></div>
          <div class="filter-group"><h3 id="fGender">Sex</h3><div class="chips" role="group" aria-labelledby="fGender">
            <button class="chip" type="button" data-f="gender" data-v="female" aria-pressed="false">Female</button>
            <button class="chip" type="button" data-f="gender" data-v="male" aria-pressed="false">Male</button></div></div>
          <div class="filter-group"><h3 id="fEnergy">Activity level</h3><div class="chips" role="group" aria-labelledby="fEnergy">
            <button class="chip" type="button" data-f="energy" data-v="1" aria-pressed="false">Calm</button>
            <button class="chip" type="button" data-f="energy" data-v="2" aria-pressed="false">Moderate</button>
            <button class="chip" type="button" data-f="energy" data-v="3" aria-pressed="false">Very active</button></div></div>
          <div class="filter-group"><h3>Home &amp; household</h3>
            <label class="check"><input type="checkbox" data-f="apartment"> Suits apartment living</label>
            <label class="check"><input type="checkbox" data-f="kids"> Good with children</label>
            <label class="check"><input type="checkbox" data-f="otherPets"> Good with other pets</label>
            <label class="check"><input type="checkbox" data-f="firstTime"> Great for first-time owners</label></div>
          <div class="filter-group"><h3><label for="fLocation">Location</label></h3><select class="select" id="fLocation" data-f="location"><option value="">Anywhere</option></select></div>
          <div class="filter-group"><h3><label for="fBreed">Breed</label></h3><select class="select" id="fBreed" data-f="breed"><option value="">Any breed</option></select></div>
          <div class="filter-group"><h3>Availability</h3><label class="check"><input type="checkbox" data-f="available"> Hide pets on hold</label></div>
        </div>
        <div class="filters-foot"><button class="btn btn-block" id="clearFilters2" type="button">Clear</button><button class="btn btn-primary btn-block" id="applyFilters" type="button">Show results</button></div>
      </aside>

      <div>
        <!-- Category bar: a quick species switcher kept in sync with the Species filter -->
        <div class="cat-bar" role="group" aria-label="Show species">
          <button class="cat" type="button" data-cat="" aria-pressed="true"><span class="ic" data-icon="paw"></span>All pets</button>
          <button class="cat" type="button" data-cat="dog" aria-pressed="false"><span class="ic" data-icon="dog"></span>Dogs</button>
          <button class="cat" type="button" data-cat="cat" aria-pressed="false"><span class="ic" data-icon="cat"></span>Cats</button>
          <button class="cat" type="button" data-cat="small" aria-pressed="false"><span class="ic" data-icon="rabbit"></span>Small pets</button>
          <button class="cat" type="button" data-cat="bird" aria-pressed="false"><span class="ic" data-icon="bird"></span>Birds</button>
          <button class="cat" type="button" data-cat="reptile" aria-pressed="false"><span class="ic" data-icon="turtle"></span>Reptiles</button>
          <button class="cat" type="button" data-cat="fish" aria-pressed="false"><span class="ic" data-icon="fish"></span>Fish</button>
          <button class="cat" type="button" data-cat="farm" aria-pressed="false"><span class="ic" data-icon="barn"></span>Goats &amp; cows</button>
        </div>
        <div id="nlResult" class="nl-result" hidden></div>
        <div class="results-bar">
          <div class="row"><button class="btn btn-sm mobile-filter-btn" id="openFilters" type="button"><span data-icon="filter"></span>Filters <span id="filterCount"></span></button>
            <h2 id="resultCount" aria-live="polite">Loading pets…</h2></div>
          <div class="row"><label class="small muted" for="sort">Sort</label>
            <select class="select" id="sort"><option value="newest">Newest first</option><option value="longestStay">Waiting longest</option><option value="youngest">Youngest</option><option value="oldestAge">Oldest</option><option value="name">Name A–Z</option></select></div>
        </div>
        <div class="active-filters" id="activeFilters"></div>
        <div class="pet-grid" id="grid"></div>
        <div class="center" style="margin-top:32px"><button class="btn btn-lg" id="loadMore" hidden>Show more pets</button></div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
