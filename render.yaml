# One-click deploy on Render (https://render.com) — "New +" → "Blueprint" → pick this repo.
services:
  - type: web
    name: pawpal
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false   # e.g. https://pawpal.onrender.com
      - key: MONGODB_URI
        sync: false   # MongoDB Atlas connection string (required — Render's disk is wiped on redeploy)
      - key: ADMIN_EMAIL
        sync: false   # the owner's email — becomes the administrator and default sender
      - key: CONTACT_EMAIL
        sync: false   # public contact address (defaults to ADMIN_EMAIL)
      - key: BREVO_API_KEY
        sync: false   # email over HTTPS from a verified single sender (works with a Gmail address)
      - key: RESEND_API_KEY
        sync: false   # alternative: needs your own domain
      - key: MAIL_FROM
        sync: false   # optional — defaults to "PawPal <ADMIN_EMAIL>"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false   # optional, paid
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false   # free option: https://aistudio.google.com/apikey
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ALLOW_DEMO_RESET
        value: false
